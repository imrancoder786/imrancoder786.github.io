<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" href="my_code_imge.png" type="image/png">
    <link rel="canonical" href="https://imrancoder786.github.io/" />
    <meta name="google-site-verification" content="_39HEylc68mukIedmWVa5mtRYaAaUlFHjrxsLiXHopI" />
</head>
<body>
    <div class="min-h-screen">
        <div class="layout-wrapper">
            <header></header>
            
            <main>
                <section class="space-y-5" id="bio-section">
                    <img
                    src="imrankhan.jpg"
                    alt="Imrankhan"
                    class="w-44 h-44 rounded-xl object-cover"
                    id="profile-img"
                    onerror="this.style.display='none';"
                    />
                </section>

                <section class="mt-14">
                    <h2 class="font-serif text-lg mb-3 pb-1 rule">Selected work</h2>
                    <ul class="space-y-3 font-sans text-[15px]" id="selected-work-list">
                        <!-- Selected works will be dynamically inserted here -->
                    </ul>
                </section>
            </main>
            
            <footer></footer>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="layout.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const profile = window.PORTFOLIO_DATA.profile;
            const selectedWork = window.PORTFOLIO_DATA.selectedWork;
            
            // 1. Render Bio Paragraphs
            const bioSection = document.getElementById("bio-section");
            profile.bio.forEach(para => {
                const p = document.createElement("p");
                p.innerHTML = para;
                bioSection.appendChild(p);
            });

            // Add reach contact paragraph
            const contactP = document.createElement("p");
            contactP.className = "font-sans text-[14px] text-muted-foreground pt-2";
            contactP.innerHTML = `
                Reach me at <a href="mailto:${profile.email}">${profile.email}</a> · 
                <a href="${profile.github}" target="_blank" rel="noreferrer">GitHub</a> · 
                <a href="${profile.linkedin}" target="_blank" rel="noreferrer">LinkedIn</a> · 
                <a href="${profile.twitter}" target="_blank" rel="noreferrer">X</a>
            `;
            bioSection.appendChild(contactP);

            // 2. Render Selected Work
            const workList = document.getElementById("selected-work-list");
            selectedWork.forEach(item => {
                const li = document.createElement("li");
                li.innerHTML = `<span class="text-muted-foreground">${item.year} —</span> ${item.text}`;
                workList.appendChild(li);
            });
        });
    </script>
</body>
</html>
