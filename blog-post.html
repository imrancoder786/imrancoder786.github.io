<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post | Imrankhan</title>
    <meta name="description" content="Technical AI research and deep learning blog post by Imrankhan.">
    <meta name="keywords" content="Machine Learning, Deep Learning, PyTorch, AI Research, Imrankhan">
    <link rel="canonical" href="https://imrancoder786.github.io/blog-post.html">
    
    <!-- Open Graph & Social Media SEO -->
    <meta property="og:title" content="Blog Post | Imrankhan">
    <meta property="og:description" content="Technical AI research and deep learning blog post by Imrankhan.">
    <meta property="og:url" content="https://imrancoder786.github.io/blog-post.html">
    <meta property="og:type" content="article">
    <meta property="og:image" content="https://imrancoder786.github.io/imrankhan.jpg">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blog Post | Imrankhan">
    <meta name="twitter:description" content="Technical AI research and deep learning blog post by Imrankhan.">
    <meta name="twitter:image" content="https://imrancoder786.github.io/imrankhan.jpg">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" href="my_code_imge.png" type="image/png">
    
    <!-- KaTeX Math CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <!-- VS Code Dark Code Highlighting CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>

    <!-- Marked JS & Extensions -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>

    <!-- Mermaid JS -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="min-h-screen">
        <div class="layout-wrapper">
            <header></header>
        </div>

        <!-- Blog post layout: sidebar TOC + content -->
        <div class="blog-post-layout" id="blog-post-layout">
            <nav class="toc-sidebar" id="toc-sidebar" aria-label="Table of Contents">
                <div class="toc-title">On this page</div>
                <ol id="toc-list">
                    <!-- Auto-generated from headings -->
                </ol>
            </nav>

            <div class="blog-post-content">
                <main id="post-content">
                    <!-- Blog post content will be dynamically rendered here -->
                </main>
            </div>
        </div>

        <!-- Mobile TOC toggle button -->
        <button class="toc-mobile-toggle" id="toc-mobile-toggle" aria-label="Toggle table of contents" title="Table of Contents">
            ☰
        </button>

        <!-- Mobile overlay backdrop -->
        <div class="toc-mobile-overlay" id="toc-mobile-overlay"></div>

        <div class="layout-wrapper" style="padding-top: 0;">
            <footer></footer>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="layout.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const posts = window.PORTFOLIO_DATA.posts;
            const contentContainer = document.getElementById("post-content");
            
            // Register Marked Extensions
            if (typeof marked !== "undefined" && typeof markedKatex !== "undefined") {
                marked.use(markedKatex({ throwOnError: false }));
            }

            // Custom heading renderer: generates id attributes for TOC anchor links
            if (typeof marked !== "undefined") {
                const renderer = new marked.Renderer();
                renderer.heading = function(data) {
                    // data can be { text, depth, raw } in newer marked versions
                    const text = typeof data === 'object' ? data.text : data;
                    const depth = typeof data === 'object' ? data.depth : arguments[1];
                    // Strip HTML tags for the slug, then create GitHub-style anchor ID
                    const rawText = text.replace(/<[^>]*>/g, '');
                    const slug = rawText
                        .toLowerCase()
                        .replace(/[^\w\s-]/g, '')   // remove special chars except hyphens
                        .replace(/\s+/g, '-')        // spaces to hyphens
                        .replace(/-+/g, '-')         // collapse multiple hyphens
                        .replace(/^-|-$/g, '');      // trim leading/trailing hyphens
                    return `<h${depth} id="${slug}">${text}</h${depth}>`;
                };
                marked.use({ renderer });
            }
            
            // Extract post query param
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('post');
            
            const post = posts.find(p => p.slug === slug);
            
            if (!post) {
                document.title = `Post Not Found — ${window.PORTFOLIO_DATA.profile.name}`;
                contentContainer.innerHTML = `
                    <h1 class="text-[26px] font-medium tracking-tight mb-6 pb-2 rule">Post not found</h1>
                    <p class="text-muted-foreground">
                        <a href="blog.html">Back to the blog</a>.
                    </p>
                `;
                return;
            }

            // Set document title and SEO metadata dynamically
            const pageTitle = `${post.title} — ${window.PORTFOLIO_DATA.profile.name}`;
            document.title = pageTitle;

            const canonicalUrl = `https://imrancoder786.github.io/blog-post.html?post=${encodeURIComponent(slug)}`;
            const metaDesc = post.summary || `Technical blog post on ${post.title} by Imrankhan`;

            const setMeta = (selector, attr, value) => {
                let el = document.querySelector(selector);
                if (el) el.setAttribute(attr, value);
            };

            setMeta('meta[name="description"]', 'content', metaDesc);
            setMeta('meta[property="og:title"]', 'content', pageTitle);
            setMeta('meta[property="og:description"]', 'content', metaDesc);
            setMeta('meta[property="og:url"]', 'content', canonicalUrl);
            setMeta('meta[name="twitter:title"]', 'content', pageTitle);
            setMeta('meta[name="twitter:description"]', 'content', metaDesc);
            setMeta('link[rel="canonical"]', 'href', canonicalUrl);

            // Inject Schema.org JSON-LD Structured Data for Google Rich Snippets
            const schemaData = {
                "@context": "https://schema.org",
                "@type": "BlogPosting",
                "headline": post.title,
                "description": metaDesc,
                "author": {
                    "@type": "Person",
                    "name": window.PORTFOLIO_DATA.profile.name,
                    "url": "https://imrancoder786.github.io/"
                },
                "datePublished": post.date,
                "mainEntityOfPage": canonicalUrl
            };
            let schemaScript = document.getElementById("json-ld-schema");
            if (!schemaScript) {
                schemaScript = document.createElement("script");
                schemaScript.id = "json-ld-schema";
                schemaScript.type = "application/ld+json";
                document.head.appendChild(schemaScript);
            }
            schemaScript.textContent = JSON.stringify(schemaData);

            let articleHtml = "";

            if (post.file) {
                const filePath = post.file.replace(/\\/g, '/');
                try {
                    const response = await fetch(filePath);
                    if (!response.ok) throw new Error("Could not load post file");
                    const markdownText = await response.text();
                    articleHtml = typeof marked !== "undefined" ? marked.parse(markdownText) : markdownText;
                } catch (err) {
                    articleHtml = `<p class="text-muted-foreground">Error loading article content from ${filePath}.</p>`;
                }
            } else if (post.body) {
                articleHtml = typeof marked !== "undefined" ? marked.parse(post.body) : post.body.replace(/\n\n+/g, '</p><p>');
            }

            contentContainer.innerHTML = `
                <div class="font-sans text-[12px] text-muted-foreground uppercase tracking-wide mb-2">
                    ${post.date}
                </div>
                <h1 class="text-[28px] font-medium tracking-tight mb-6 pb-2 rule">
                    ${post.title}
                </h1>
                <article class="markdown-body">
                    ${articleHtml}
                </article>
                <div class="mt-12 font-sans text-[14px]">
                    <a href="blog.html">← All posts</a>
                </div>
            `;

            // 1. VS Code Syntax Highlighting
            if (typeof hljs !== "undefined") {
                hljs.highlightAll();
            }

            // 2. KaTeX Math Equation Renderer
            if (typeof renderMathInElement !== "undefined") {
                renderMathInElement(contentContainer, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            }

            // 3. Render Mermaid Diagrams
            if (typeof mermaid !== "undefined") {
                try {
                    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
                    const codeBlocks = contentContainer.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid');
                    codeBlocks.forEach(code => {
                        const pre = code.parentElement;
                        const div = document.createElement('div');
                        div.className = 'mermaid';
                        div.textContent = code.textContent;
                        pre.parentElement.replaceChild(div, pre);
                    });
                    await mermaid.run();
                } catch (e) {
                    console.warn("Mermaid render error:", e);
                }
            }

            // 4. Build Sidebar TOC from rendered headings
            buildSidebarTOC();

            // 5. Setup scroll-based active heading tracking
            setupScrollSpy();

            // 6. Setup mobile TOC toggle
            setupMobileTOC();
        });

        /**
         * Extracts h2 headings from the rendered article
         * and populates the sidebar TOC (main sections only).
         */
        function buildSidebarTOC() {
            const article = document.querySelector('.markdown-body');
            const tocList = document.getElementById('toc-list');
            if (!article || !tocList) return;

            const headings = article.querySelectorAll('h2');
            if (headings.length === 0) {
                // No headings — hide sidebar entirely
                const sidebar = document.getElementById('toc-sidebar');
                if (sidebar) sidebar.style.display = 'none';
                return;
            }

            const fragment = document.createDocumentFragment();

            headings.forEach(heading => {
                const id = heading.id;
                if (!id) return;

                // Clean heading text: strip HTML tags, trim
                const text = heading.textContent.trim();
                if (!text) return;

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${id}`;
                a.textContent = text;
                a.setAttribute('data-target', id);

                // Smooth scroll on click
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.getElementById(id);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        // Update URL hash without jumping
                        history.replaceState(null, '', `#${id}`);
                    }
                    // Close mobile TOC if open
                    closeMobileTOC();
                });

                li.appendChild(a);
                fragment.appendChild(li);
            });

            tocList.appendChild(fragment);
        }

        /**
         * Uses IntersectionObserver to highlight the current section
         * in the sidebar TOC as the user scrolls.
         */
        function setupScrollSpy() {
            const tocLinks = document.querySelectorAll('#toc-list a');
            if (tocLinks.length === 0) return;

            const headingIds = Array.from(tocLinks).map(a => a.getAttribute('data-target'));
            const headingElements = headingIds
                .map(id => document.getElementById(id))
                .filter(Boolean);

            if (headingElements.length === 0) return;

            let currentActive = null;

            const observer = new IntersectionObserver((entries) => {
                // Find the topmost visible heading
                let topHeading = null;
                let topY = Infinity;

                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const rect = entry.boundingClientRect;
                        if (rect.top < topY) {
                            topY = rect.top;
                            topHeading = entry.target;
                        }
                    }
                });

                if (topHeading) {
                    setActiveTOCLink(topHeading.id);
                }
            }, {
                rootMargin: '-10% 0px -80% 0px',
                threshold: 0
            });

            headingElements.forEach(el => observer.observe(el));

            // Also handle scroll for fallback — find the heading closest to top
            let scrollTimeout;
            window.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    let closest = null;
                    let closestDist = Infinity;

                    headingElements.forEach(el => {
                        const rect = el.getBoundingClientRect();
                        const dist = Math.abs(rect.top - 80);
                        if (rect.top <= 120 && dist < closestDist) {
                            closestDist = dist;
                            closest = el;
                        }
                    });

                    if (closest) {
                        setActiveTOCLink(closest.id);
                    }
                }, 50);
            }, { passive: true });
        }

        /**
         * Highlights a specific TOC link and removes highlight from others.
         */
        function setActiveTOCLink(id) {
            const tocLinks = document.querySelectorAll('#toc-list a');
            tocLinks.forEach(link => {
                if (link.getAttribute('data-target') === id) {
                    link.classList.add('toc-active');
                    // Scroll the TOC sidebar so the active link is visible
                    const sidebar = document.getElementById('toc-sidebar');
                    if (sidebar) {
                        const linkTop = link.offsetTop;
                        const sidebarScroll = sidebar.scrollTop;
                        const sidebarHeight = sidebar.clientHeight;
                        if (linkTop < sidebarScroll || linkTop > sidebarScroll + sidebarHeight - 40) {
                            sidebar.scrollTo({ top: linkTop - sidebarHeight / 3, behavior: 'smooth' });
                        }
                    }
                } else {
                    link.classList.remove('toc-active');
                }
            });
        }

        /**
         * Sets up the mobile TOC drawer toggle.
         */
        function setupMobileTOC() {
            const toggle = document.getElementById('toc-mobile-toggle');
            const overlay = document.getElementById('toc-mobile-overlay');
            const sidebar = document.getElementById('toc-sidebar');

            if (!toggle || !overlay || !sidebar) return;

            toggle.addEventListener('click', () => {
                const isOpen = sidebar.classList.contains('mobile-open');
                if (isOpen) {
                    closeMobileTOC();
                } else {
                    openMobileTOC();
                }
            });

            overlay.addEventListener('click', closeMobileTOC);
        }

        function openMobileTOC() {
            const sidebar = document.getElementById('toc-sidebar');
            const overlay = document.getElementById('toc-mobile-overlay');
            const toggle = document.getElementById('toc-mobile-toggle');

            if (sidebar) sidebar.classList.add('mobile-open');
            if (overlay) {
                overlay.style.display = 'block';
                requestAnimationFrame(() => overlay.classList.add('visible'));
            }
            if (toggle) toggle.innerHTML = '✕';
        }

        function closeMobileTOC() {
            const sidebar = document.getElementById('toc-sidebar');
            const overlay = document.getElementById('toc-mobile-overlay');
            const toggle = document.getElementById('toc-mobile-toggle');

            if (sidebar) sidebar.classList.remove('mobile-open');
            if (overlay) {
                overlay.classList.remove('visible');
                setTimeout(() => { overlay.style.display = 'none'; }, 300);
            }
            if (toggle) toggle.innerHTML = '☰';
        }
    </script>
</body>
</html>
