<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" href="my_code_imge.png" type="image/png">
    <link rel="canonical" href="https://imrancoder786.github.io/research.html">

    <!-- Open Graph / LinkedIn / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Research | Imrankhan">
    <meta property="og:description" content="AI and machine learning research by Imrankhan.">
    <meta property="og:url" content="https://imrancoder786.github.io/research.html">
    <meta property="og:image" content="https://imrancoder786.github.io/my_code_imge.png">

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Research | Imrankhan">
    <meta name="twitter:description" content="AI and machine learning research by Imrankhan.">
    <meta name="twitter:image" content="https://imrancoder786.github.io/my_code_imge.png">
</head>
<body>
    <div class="min-h-screen">
        <div class="layout-wrapper">
            <header></header>
            
            <main>
                <h1 class="text-[26px] font-medium tracking-tight mb-6 pb-2 rule">Research</h1>
                <p class="text-muted-foreground mb-8" id="research-intro">
                    <!-- Intro will be dynamically inserted here -->
                </p>

                <div class="space-y-7" id="interests-list">
                    <!-- Research interests will be dynamically inserted here -->
                </div>

                <section class="mt-14">
                    <h2 class="font-serif text-lg mb-3 pb-1 rule">Currently reading</h2>
                    <ul class="font-sans text-[15px] space-y-2 text-muted-foreground" id="reading-list">
                        <!-- Reading list items will be dynamically inserted here -->
                    </ul>
                </section>
            </main>
            
            <footer></footer>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="layout.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const research = window.PORTFOLIO_DATA.research;
            
            // 1. Render Intro
            document.getElementById("research-intro").textContent = research.intro;
            
            // 2. Render Interests
            const interestsList = document.getElementById("interests-list");
            research.interests.forEach(interest => {
                const div = document.createElement("div");
                div.innerHTML = `
                    <h3 class="font-serif text-[19px] mb-1">${interest.title}</h3>
                    <p>${interest.body}</p>
                `;
                interestsList.appendChild(div);
            });

            // 3. Render Reading List
            const readingList = document.getElementById("reading-list");
            research.readingList.forEach(book => {
                const li = document.createElement("li");
                li.innerHTML = book;
                readingList.appendChild(li);
            });
        });
    </script>
</body>
</html>
