<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" href="my_code_imge.png" type="image/png">
</head>
<body>
    <div class="min-h-screen">
        <div class="layout-wrapper">
            <header></header>
            
            <main>
                <h1 class="text-[26px] font-medium tracking-tight mb-6 pb-2 rule">Blog</h1>
                <div id="blog-container">
                    <!-- Blog posts will be dynamically inserted here -->
                </div>
            </main>
            
            <footer></footer>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="layout.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const posts = window.PORTFOLIO_DATA.posts;
            const container = document.getElementById("blog-container");
            
            if (!posts || posts.length === 0) {
                container.innerHTML = `
                    <p class="text-muted-foreground">
                        No posts yet. Notes on papers I’m reading and experiments I’m running
                        will land here.
                    </p>
                `;
                return;
            }

            const ul = document.createElement("ul");
            ul.className = "space-y-6";

            posts.forEach(p => {
                const li = document.createElement("li");
                
                li.innerHTML = `
                    <div class="font-sans text-[12px] text-muted-foreground uppercase tracking-wide">
                        ${p.date}
                    </div>
                    <a href="blog-post.html?post=${p.slug}" class="font-serif text-[19px] logo hover:!underline" style="font-size: 19px; display: inline-block; margin-top: 2px;">
                        ${p.title}
                    </a>
                    <p class="text-[15.5px] text-muted-foreground mt-1">${p.summary}</p>
                `;
                ul.appendChild(li);
            });
            container.appendChild(ul);
        });
    </script>
</body>
</html>
